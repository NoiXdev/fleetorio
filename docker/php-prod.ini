; PHP-Einstellungen für den Betrieb im Image.
;
; Das FrankenPHP-Basisimage lädt bewusst *keine* php.ini — weder
; php.ini-production noch php.ini-development. Es gelten also PHPs eingebaute
; Standardwerte, und die sind für diese Anwendung an zwei Stellen zu klein.
; Prüfbar im Basisimage mit:
;
;   docker run --rm dunglas/frankenphp:1-php8.4 \
;       php -r 'echo ini_get("upload_max_filesize"), " ", php_ini_loaded_file() ?: "keine";'
;   -> 2M keine
;
; Diese Datei landet in /usr/local/etc/php/conf.d/ und wird deshalb geladen.

; --- Upload-Grenzen -------------------------------------------------------
;
; Der eingebaute Standard ist upload_max_filesize=2M und post_max_size=8M. Die
; Anwendung lässt Fahrzeugdokumente bis 25 MB und Bilder bis 10 MB zu (siehe
; VehicleDocumentsRelationManager::MAX_FILE_SIZE_KB und
; VehicleForm::MAX_IMAGE_SIZE_KB). Ohne diese Werte scheitert ein größerer
; Upload nicht an der Prüfung der Anwendung, sondern schon vorher an PHP — und
; zwar mit einer Meldung, aus der die Ursache nicht hervorgeht („Feld ist
; erforderlich" statt einer Aussage zur Größe).
;
; Wer die Grenzen in der Anwendung ändert, muss diese Werte mitziehen.
; post_max_size muss über upload_max_filesize liegen: der Wert umfasst den
; gesamten Formularinhalt, nicht nur die Datei.
upload_max_filesize = 30M
post_max_size = 32M

; --- OPcache --------------------------------------------------------------
;
; Die Erweiterung ist im Basisimage vorhanden, aber ungetunt.
; validate_timestamps bleibt bewusst auf dem Standard (an): bei dieser
; Nutzerzahl kostet der stat-Aufruf nichts Messbares, und ein neues Deployment
; (neues Image, frischer Container) liefert damit immer aktuellen Code, ohne
; dass zusätzlich ein Cache verworfen werden muss.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; --- Betrieb --------------------------------------------------------------
;
; Laravel schaltet display_errors selbst ab (HandleExceptions), aber erst wenn
; das Framework läuft. Ein Fehler davor — etwa eine fehlende Erweiterung —
; würde sonst mit Pfaden und Codezeilen im Browser landen.
display_errors = Off
expose_php = Off
