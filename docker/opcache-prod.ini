; Production OPcache tuning. validate_timestamps is left at its default (on)
; deliberately: at this traffic level (3-5 users) the filesystem stat check
; costs nothing measurable, and it means a new deployment (new image, fresh
; container) always serves current code with no extra cache-busting step.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
