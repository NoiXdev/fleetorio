; Upload-Grenzen für den Betrieb im Container.
;
; PHPs php.ini-production erlaubt standardmäßig nur upload_max_filesize=2M und
; post_max_size=8M. Die Anwendung lässt Fahrzeugdokumente bis 25 MB und Bilder
; bis 10 MB zu (siehe VehicleDocumentsRelationManager::MAX_FILE_SIZE_KB und
; VehicleForm::MAX_IMAGE_SIZE_KB). Ohne diese Datei würde ein größerer Upload
; nicht an der Prüfung der Anwendung scheitern, sondern schon vorher an PHP —
; und zwar mit einer Meldung, aus der die Ursache nicht hervorgeht.
;
; Wer die Grenzen in der Anwendung ändert, muss diese Werte mitziehen.
; post_max_size muss über upload_max_filesize liegen: der Wert umfasst den
; gesamten Formularinhalt, nicht nur die Datei.

upload_max_filesize = 30M
post_max_size = 32M
