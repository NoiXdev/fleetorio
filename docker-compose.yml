# Local trial stack for the Docker image - NOT a hosting setup and not a
# replacement for DDEV, which remains the local development environment
# untouched by any of this. This is only here so the image can be tried out
# on a machine without any hosting in place yet.
#
# Host ports are deliberately non-standard: DDEV already occupies 80/443 on
# the host, and running both at once must not collide. This stack publishes
# on 8080 instead - adjust below if 8080 is also taken locally.
#
# Usage:
#   APP_KEY=base64:... docker compose up --build
#   docker compose exec app php artisan migrate   # first run only, see README
#   docker compose down -v                        # tear down, including the volumes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_NAME: Fuhrparkmanagement
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      # Required, no default on purpose - see .env.docker.example. Must be the
      # key from the existing installation, never a freshly generated one.
      APP_KEY: "${APP_KEY:?Set APP_KEY before starting, e.g. APP_KEY=base64:... docker compose up}"
      APP_LOCALE: de
      APP_FALLBACK_LOCALE: en
      LOG_LEVEL: debug
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: fuhrpark
      DB_USERNAME: fuhrpark
      DB_PASSWORD: fuhrpark
      SESSION_DRIVER: database
      SESSION_LIFETIME: "60"
      SESSION_EXPIRE_ON_CLOSE: "true"
      # This trial stack is plain http on localhost, not https - a secure
      # cookie would never be sent back and login would silently fail. Set
      # this true in real deployments (see .env.docker.example).
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      # Bare port, no domain: tells FrankenPHP's Caddy to serve plain http on
      # 80 and skip automatic HTTPS entirely - there's no real domain to get a
      # certificate for on a local trial. See README for the two HTTPS paths
      # used in an actual deployment.
      SERVER_NAME: ":80"
    volumes:
      - storage_app:/app/storage/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: fuhrpark
      MARIADB_USER: fuhrpark
      MARIADB_PASSWORD: fuhrpark
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  storage_app:
